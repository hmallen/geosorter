# geosorter configuration — EXAMPLE.
#
# Copy this file to `geosorter.toml` and edit the paths for your machine. The real
# `geosorter.toml` is gitignored and stays local; this example is the tracked template.
#
# Config-file resolution order (see src/geosorter/config.py):
#   1. --config PATH
#   2. $GEOSORTER_CONFIG
#   3. platformdirs user_config_dir("geosorter")/geosorter.toml
#
# All paths below are FICTIONAL placeholders — replace them with your own.

# Inbox to scan and library to file into (both required by `geosorter organize`).
inbox_path = 'D:\drone\inbox'
library_root = 'Z:\DroneLibrary'

# Local-disk databases (keep these OFF library_root). Defaults fall under
# platformdirs user_data_dir when unset; set explicit local paths here if you prefer.
index_db_path = 'C:\Users\you\AppData\Local\geosorter\index.db'
geonames_db_path = 'C:\Users\you\AppData\Local\geosorter\geonames.db'

# Spatial index for geocoding: 'rtree' (default) or 'columnar' (fallback).
spatial_index = 'rtree'

# Admin password hash. When set, the map UI is view-only until login and the
# mutating API routes (organize/undo/rescan/retag/assign/stitch) require a valid
# admin token; unset means the app and API are fully open. Do NOT write a plaintext
# password here — generate the hash with `geosorter set-admin-password`.
# admin_password_hash = 'pbkdf2_sha256$...'

# --- Optional tuning (defaults shown; uncomment to override) ---

# Prefer-nearest-feature radius (km): a named park/peak/lake within this distance of
# the capture wins over the nearest town. Requires `bootstrap --features`.
# feature_proximity_km = 5.0

# Neighbor-GPS inference window (minutes): a capture missing GPS but carrying a
# timestamp borrows the location of the nearest-in-time GPS-tagged capture within
# this window; beyond it the no-GPS file is quarantined.
# inference_max_gap_minutes = 30.0

# Retain DJI hyperlapse source frames alongside the rendered video (filed into a
# `<render>_frames/` subfolder). Set false to file only the render.
# retain_hyperlapse_frames = true

# Move a detected duplicate (content already in the library) into
# `<inbox>/_duplicates/` and log it to `_duplicates/duplicates.log`, instead of
# leaving it in the inbox. Set false to restore the old skip-in-place behavior.
# relocate_duplicates = true

# Directory holding the Hugin CLI tools for 360 panorama stitching. Leave unset to
# detect them on PATH; absent Hugin just disables stitching (the tile gallery remains).
# hugin_bin_dir = 'C:\Program Files\Hugin\bin'

# --- Panorama-stitch tuning (smaller/faster 360 stitch) ---
# Output canvas (WIDTHxHEIGHT); smaller = faster. Default shrank to 4000x2000.
# stitch_canvas = '4000x2000'
# Opt-out quality steps: cpfind --celeste (cloud control-point removal) and
# autooptimiser -l (lens geometry). Both default on; set false for a faster stitch.
# stitch_celeste = true
# stitch_optimise_lens = true

# --- Upload-resilience knobs (sized for a multi-hour, 5-20k-file bulk import) ---

# Free-space headroom (GB) required over the source bytes; a mid-run recheck aborts
# the batch cleanly before the share fills.
# disk_margin_gb = 5.0

# Per-file copy attempts on a transient OSError (e.g. an SMB disconnect), with an
# exponential backoff whose base (seconds) is copy_retry_backoff_s.
# copy_retry_attempts = 3
# copy_retry_backoff_s = 0.5

# ExifTool pass-1 chunking: groups per daemon before a fresh restart, and per-file
# extract attempts before a file is quarantined as unreadable.
# extract_chunk_size = 500
# extract_max_failures = 3

# --- Derived-cache tiering (keep hot thumbnails off the SMB share) ---

# Local-SSD cache for thumbnails/posters/previews. Defaults to the platformdirs user
# cache dir; must be absolute and NOT inside library_root or inbox_path.
# cache_dir = 'C:\Users\you\AppData\Local\geosorter\Cache'

# Tier for HEVC proxies + panorama stitches (large, written-once). Defaults to
# library_root; point it at an SSD-backed share to relocate. Absolute when set.
# proxy_cache_dir = 'Z:\DroneLibrary'

# Local-tier eviction cap (GB); the sweep that honours it lands in a later task.
# cache_max_gb = 10.0

# Pre-generate HEVC->H.264 playback proxies during the post-organize warm pass so the
# first play of an HEVC clip is instant. Off by default (proxies are large/slow).
# warm_proxies = false

# Cap (GB) on the proxy tier's HEVC proxies. Unset = uncapped (never evicted). When
# set, the warm pass LRU-evicts proxies down to it (stitch heroes are never evicted).
# proxy_cache_max_gb = 50.0

# Hardware encoder for the HEVC->H.264 proxy transcode: 'auto' (default — NVENC when
# an h264_nvenc-capable ffmpeg is detected, else libx264, with a libx264 fallback if an
# NVENC encode fails), 'nvenc' (force NVENC; a failure surfaces), or 'none' (always
# libx264). NVENC needs an NVIDIA GPU + an ffmpeg built with h264_nvenc/CUDA.
# proxy_hwaccel = 'auto'
