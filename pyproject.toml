[project]
name = "geosorter"
version = "0.1.0"
description = "Organize DJI drone media by location and date with an interactive map."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "platformdirs>=4.0",
    "httpx>=0.27",
    "pyexiftool>=0.5",
    "timezonefinder>=6.5",
    "tzdata",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pillow>=10.0",
]

[project.scripts]
geosorter = "geosorter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geosorter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]
